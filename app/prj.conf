# add desired CONFIGs here

# ---------------------------------------------------------------------------
# Core shell
# ---------------------------------------------------------------------------
# turns on the shell subsystem itself
CONFIG_SHELL=y
# runs the shell over the UART chosen as 'zephyr,shell-uart' in the board dts
CONFIG_SHELL_BACKEND_SERIAL=y
# the shell thread needs more stack than the default once logging/getopt are on
CONFIG_SHELL_STACK_SIZE=4096
# text shown before every command you type
CONFIG_SHELL_PROMPT_UART="zephyr:~$ "
# max length of one typed command line, and max number of words in it
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_ARGC_MAX=20

# ---------------------------------------------------------------------------
# Quality of life features (these make the shell feel like a normal terminal)
# ---------------------------------------------------------------------------
# up/down arrow to scroll through previous commands
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=1024
# press tab to list/complete commands and subcommands
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
# lets you use '*' and '?' in command names (e.g. "log enable dbg *")
CONFIG_SHELL_WILDCARD=y
# ctrl+a, ctrl+e, ctrl+w, ctrl+l etc. like in bash
CONFIG_SHELL_METAKEYS=y
# colored output (errors red, warnings yellow) and cursor movement
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_VT100_COLORS=y
# "help" command and "-h"/"--help" on every command
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HELP_ON_WRONG_ARGUMENT_COUNT=y
# thread safe getopt() so your own commands can parse flags like "-v -n 5"
CONFIG_SHELL_GETOPT=y
# "retval" command prints the return value of the last command you ran
CONFIG_SHELL_CMDS_RETURN_VALUE=y

# ---------------------------------------------------------------------------
# Built-in shell commands
# ---------------------------------------------------------------------------
# clear, history, shell echo/colors/stats/backspace_mode etc.
CONFIG_SHELL_CMDS=y
# "resize" - matches the shell width to your terminal window
CONFIG_SHELL_CMDS_RESIZE=y
# "select" - lets you "cd" into a command so you don't retype the prefix
CONFIG_SHELL_CMDS_SELECT=y
# "shell stats" - counts of dropped log messages etc.
CONFIG_SHELL_STATS=y

# the "kernel" command needs these to show thread names, stack usage and CPU %
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
# lets "kernel reboot" work
CONFIG_REBOOT=y

# All the other built-in command modules (kernel, device, gpio, i2c, spi,
# sensor, flash, adc, pwm, ...) are turned on in app/Kconfig, so each one is only
# enabled when your board supports it. Turn one off here with e.g. CONFIG_CAN_SHELL=n

# ---------------------------------------------------------------------------
# Logging (log messages print into the shell without breaking the prompt)
# ---------------------------------------------------------------------------
CONFIG_LOG=y
# sends LOG_INF/LOG_ERR/etc. output through the shell
CONFIG_SHELL_LOG_BACKEND=y
# "log" command - enable/disable/change log levels per module at runtime
CONFIG_LOG_CMDS=y
# the shell already owns the uart, so don't also print logs raw to it
CONFIG_LOG_BACKEND_UART=n
